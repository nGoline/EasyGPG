name: Release to Play

# Tag a release commit (`git tag v0.4 && git push origin v0.4`) to publish, or run the workflow
# by hand to push the current commit to a chosen track.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play track to publish to
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      status:
        description: Release status on that track
        type: choice
        default: completed
        options: [completed, draft]

permissions:
  contents: read

jobs:
  publish:
    name: Build, sign and upload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Gate the signing and Play secrets behind an environment, so a release can require a manual
    # approval and the secrets are unavailable to any other workflow.
    environment: play-release

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Play rejects a bundle whose versionCode it has already seen, and a tag that disagrees with
      # the manifest makes releases impossible to trace. Catch both before anything is signed.
      - name: Check the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          version_name="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          if [ "$tag_version" != "$version_name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies versionName $tag_version, but app/build.gradle.kts declares $version_name."
            exit 1
          fi
          echo "Releasing versionName $version_name as $GITHUB_REF_NAME."

      - name: Run the tests
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Decode the upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::Secret UPLOAD_KEYSTORE_BASE64 is not set in the play-release environment."
            exit 1
          fi
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build the release bundle
        env:
          UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      # An unsigned bundle is rejected by Play with a far less obvious error, and a misconfigured
      # UPLOAD_KEYSTORE_FILE silently yields one rather than failing the build.
      - name: Verify the bundle was signed
        run: |
          aab=app/build/outputs/bundle/release/app-release.aab
          # Anchored to a top-level signature block: library META-INF entries sit under base/root/
          # and would otherwise match an unsigned bundle.
          if ! unzip -l "$aab" | awk '{print $4}' | grep -qE '^META-INF/[^/]+\.(RSA|DSA|EC)$'; then
            echo "::error::$aab has no signature block — it was built unsigned."
            exit 1
          fi
          jarsigner -verify "$aab" | grep -q '^jar verified\.$' || {
            echo "::error::jarsigner could not verify $aab."
            exit 1
          }
          echo "Signed bundle: $(du -h "$aab" | cut -f1)"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ngoline.easygpg
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'completed' }}

      # Keep the signed artifact for reference, but never the key.
      - name: Upload the bundle as a build artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: ignore

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
