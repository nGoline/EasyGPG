name: Release to Play

# Tag a release commit (`git tag v0.4 && git push origin v0.4`) to publish, or run the workflow
# by hand to push the current commit to a chosen track.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play track to publish to
        type: choice
        default: alpha
        options: [alpha, internal, beta, production]
      status:
        description: Release status on that track
        type: choice
        default: completed
        options: [completed, draft]

permissions:
  contents: read

jobs:
  publish:
    name: Build, sign and upload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Gate the signing and Play secrets behind an environment, so a release can require a manual
    # approval and the secrets are unavailable to any other workflow.
    environment: play-release

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history and tags, so the versionCode check can read the previous release.
          fetch-depth: 0

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A tag disagreeing with the manifest makes releases impossible to trace, and Play rejects a
      # versionCode it has already accepted — after the whole pipeline has run. Catch both here.
      - name: Check the tag and version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          version_name="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          version_code="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)"

          if [ "$tag_version" != "$version_name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies versionName $tag_version, but app/build.gradle.kts declares $version_name."
            exit 1
          fi
          if [ -z "$version_code" ]; then
            echo "::error::Could not read versionCode from app/build.gradle.kts."
            exit 1
          fi

          # Compare against the previous tag, which catches the common mistake: bumping
          # versionName for a release and forgetting versionCode.
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            previous_code="$(git show "$previous:app/build.gradle.kts" 2>/dev/null \
              | sed -n 's/.*versionCode = \([0-9]*\).*/\1/p')"
            if [ -n "$previous_code" ] && [ "$version_code" -le "$previous_code" ]; then
              echo "::error::versionCode $version_code is not greater than $previous_code at $previous. Play will reject it."
              exit 1
            fi
            echo "versionCode $version_code (was $previous_code at $previous)."
          fi
          echo "Releasing versionName $version_name, versionCode $version_code as $GITHUB_REF_NAME."

      - name: Run the tests
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Decode the upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::Secret UPLOAD_KEYSTORE_BASE64 is not set in the play-release environment."
            exit 1
          fi
          # Strip whitespace first: `base64` wraps its output on some platforms, and a secret
          # pasted with line breaks would otherwise decode into a corrupt keystore.
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload.jks"

          # Open it here rather than letting a bad secret surface as a confusing Gradle error.
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
                 -storepass "$UPLOAD_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ks.txt" 2>&1; then
            echo "::error::Could not open the decoded keystore. Check UPLOAD_KEYSTORE_BASE64 and UPLOAD_KEYSTORE_PASSWORD."
            sed 's/^/  /' "$RUNNER_TEMP/ks.txt" | head -5
            exit 1
          fi
          if ! grep -qi "^$UPLOAD_KEY_ALIAS," "$RUNNER_TEMP/ks.txt"; then
            echo "::error::Alias '$UPLOAD_KEY_ALIAS' is not in the keystore. It contains:"
            grep -i "PrivateKeyEntry" "$RUNNER_TEMP/ks.txt" | sed 's/^/  /'
            exit 1
          fi
          echo "Keystore opened; alias '$UPLOAD_KEY_ALIAS' present."
          rm -f "$RUNNER_TEMP/ks.txt"

      - name: Build the release bundle
        env:
          UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      # An unsigned bundle is rejected by Play with a far less obvious error, and a misconfigured
      # UPLOAD_KEYSTORE_FILE silently yields one rather than failing the build.
      - name: Verify the bundle was signed
        run: |
          aab=app/build/outputs/bundle/release/app-release.aab
          # Anchored to a top-level signature block: library META-INF entries sit under base/root/
          # and would otherwise match an unsigned bundle.
          if ! unzip -l "$aab" | awk '{print $4}' | grep -qE '^META-INF/[^/]+\.(RSA|DSA|EC)$'; then
            echo "::error::$aab has no signature block — it was built unsigned."
            exit 1
          fi
          jarsigner -verify "$aab" | grep -q '^jar verified\.$' || {
            echo "::error::jarsigner could not verify $aab."
            exit 1
          }
          echo "Signed bundle: $(du -h "$aab" | cut -f1)"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ngoline.easygpg
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          # Closed testing ("alpha"): the only track that can read the tester Google Group.
          track: ${{ inputs.track || 'alpha' }}
          status: ${{ inputs.status || 'completed' }}

      # Keep the signed artifact for reference, but never the key.
      - name: Upload the bundle as a build artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: ignore

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/ks.txt"
