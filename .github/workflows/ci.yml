name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The wrapper is an executable committed to the repository, so verify it against the
      # published Gradle checksums before running it.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      # Uploaded even when the build fails — that is exactly when the reports are wanted.
      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (API 35 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Hardware acceleration; without it the emulator is too slow to be usable here.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # A lock screen changes boot behaviour, so give the emulator a predictable one.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # android-emulator-runner runs this one line per `sh -c`, so every line here must be a
          # complete command on its own — no loops, no variables carried between lines.
          script: |
            adb wait-for-device
            ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
            .github/scripts/prepare-emulator.sh
            ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore
